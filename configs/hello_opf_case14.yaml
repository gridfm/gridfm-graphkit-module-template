# OptimalPowerFlow config: HelloGridModel + graphkit's built-in OPF transforms
# (RemoveInactiveBranches -> RemoveInactiveGenerators -> AddOPFHeteroMask ->
# ApplyMasking), selected by `task.task_name: OptimalPowerFlow`.
#   gridfm_graphkit train --config configs/hello_opf_case14.yaml \
#       --plugins gridfm_module_template
version: 1
task:
  task_name: OptimalPowerFlow
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case14_ieee
  scenarios:
  - 250000
  test_ratio: 0.1
  val_ratio: 0.1
model:
  type: HelloGridModel          # <-- plugin model
  hidden_size: 32
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
optimizer:
  type: AdamW
  learning_rate: 0.0005
  scheduler_type: ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7
    patience: 5
seed: 0
training:
  batch_size: 64
  epochs: 5
  losses:
  - MaskedBusMSE
  loss_weights:
  - 1.0
  loss_args:
  - {}
  accelerator: auto
  devices: auto
  strategy: auto
verbose: true
