[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridfm-module-template"
version = "0.1.0"
description = "Hello-world template for building a 3rd-party gridfm-graphkit module (model + transform plugin)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # graphkit is the host runtime. Pinned to the branch that carries the
    # entry-point plugin auto-discovery + config transform-list support this
    # template relies on. Switch to `@main` once that branch is merged, and to a
    # PyPI release (e.g. "gridfm-graphkit>=0.9") once one is published.
    "gridfm-graphkit @ git+https://github.com/gridfm/gridfm-graphkit.git@docs/modular-runtime-design",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

# Auto-discovery entry point. graphkit scans the `gridfm_graphkit.plugins`
# group at startup, so simply installing this package registers the model +
# transform — no `--plugins` flag needed. (`--plugins gridfm_module_template`
# still works if you prefer to load it explicitly.)
[project.entry-points."gridfm_graphkit.plugins"]
gridfm_module_template = "gridfm_module_template:register"

[tool.setuptools.packages.find]
where = ["src"]
