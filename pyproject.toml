[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridfm-module-template"
version = "0.1.0"
description = "Hello-world template for building a 3rd-party gridfm-graphkit module (model + transform plugin)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # graphkit is the host runtime. Pinned to the latest PyPI release, which
    # carries the entry-point plugin auto-discovery + config transform-list
    # support this template relies on. This is a pre-release (RC); the exact
    # `==` pin installs it without needing pip's --pre flag. Bump to the stable
    # 0.9.1 (or a range like ">=0.9.1") once it is published.
    "gridfm-graphkit==0.9.1rc1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

# Auto-discovery entry point. graphkit scans the `gridfm_graphkit.plugins`
# group at startup, so simply installing this package registers the model +
# transform — no flag needed.
[project.entry-points."gridfm_graphkit.plugins"]
gridfm_module_template = "gridfm_module_template:register"

[tool.setuptools.packages.find]
where = ["src"]
